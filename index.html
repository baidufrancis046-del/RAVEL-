<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAVEL City Driver - Kumasi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;-webkit-tap-highlight-color:transparent}
body{background:#111;color:white;overflow:hidden}
header{background:#ffcc00;color:black;padding:10px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}
#installBtn{background:black;color:#ffcc00;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;display:none}
.stats{display:flex;justify-content:space-around;background:#222;padding:10px;font-weight:bold;font-size:14px}
canvas{background:#2d6a2e;width:100%;height:52vh;display:block;border-bottom:4px solid #ffcc00}
.controls{background:#111;padding:12px}
.row{display:flex;justify-content:center;gap:10px;margin:5px 0}
.btn{background:#333;color:white;border:none;width:70px;height:60px;border-radius:15px;font-size:26px;touch-action:none}
.btn:active{background:#ffcc00;color:black}
.gas-btn{background:#25D366!important}
.brake-btn{background:#e50914!important}
.start{background:#25D366;color:white;border:none;padding:13px 25px;border-radius:25px;font-weight:bold;width:100%;font-size:16px;margin-top:8px}
.level{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 15px;border-radius:20px;font-size:13px}
</style>
</head>
<body>

<header><b>🚗 RAVEL CITY DRIVER</b><button id="installBtn">📲 Install App</button></header>

<div class="stats">
<span>💰 <span id="score">0</span></span>
<span>🏆 Best: <span id="best">0</span></span>
<span>⛽ <span id="fuel">100</span>%</span>
<span>🚓 <span id="level">Level 1</span></span>
</div>

<div style="position:relative">
<canvas id="game" width="700" height="450"></canvas>
<div class="level" id="msg">Tap START to Drive in Kumasi!</div>
</div>

<div class="controls">
<div class="row">
<button class="btn" id="leftBtn">⬅️</button>
<button class="btn" id="upBtn">⬆️</button>
<button class="btn" id="rightBtn">➡️</button>
</div>
<div class="row">
<button class="btn brake-btn" id="downBtn">🛑 BRAKE</button>
<button class="btn gas-btn" id="gasBtn">⛽ GAS</button>
<button class="btn" onclick="honk()">📯</button>
</div>
<button class="start" onclick="startGame()">▶️ START / RESTART GAME</button>
<p style="text-align:center;color:#aaa;font-size:12px;margin-top:8px">Deliver RAVEL Water 💧 to houses • Avoid Police 🚓 • Collect ₵ Coins<br>Made by Francis Baidu • Kumasi • 055 834 8463</p>
</div>

<script>
let canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let car={x:350,y:350,w:40,h:65,speed:0,angle:0};
let coins=[], traffic=[], houses=[], fuelStations=[];
let score=0, fuel=100, level=1, gameOn=false, best=localStorage.getItem('ravel_best')||0;
document.getElementById('best').innerText=best;

function startGame(){
  score=0; fuel=100; level=1; car.x=350; car.y=350; car.speed=0; car.angle=0;
  coins=[]; traffic=[]; houses=[];
  for(let i=0;i<6;i++) coins.push({x:Math.random()*600+50,y:Math.random()*350+50});
  for(let i=0;i<3;i++) traffic.push({x:Math.random()*600+50,y:Math.random()*300,speed:1});
  for(let i=0;i<3;i++) houses.push({x:Math.random()*600+50,y:Math.random()*350+50,done:false});
  gameOn=true; document.getElementById('msg').innerText="🚗 Drive! Deliver Water to 💧 Houses!";
  setTimeout(()=>document.getElementById('msg').innerText="",3000);
}
function honk(){ if(gameOn) document.getElementById('msg').innerText="📯 BEEP BEEP! RAVEL Coming!"; setTimeout(()=>document.getElementById('msg').innerText="",1000); }

function bind(id, fn){
  let b=document.getElementById(id);
  b.addEventListener('touchstart',e=>{e.preventDefault(); fn();});
  b.addEventListener('mousedown',fn);
}
bind('upBtn',()=>{car.speed=Math.min(car.speed+2,9)});
bind('downBtn',()=>{car.speed=Math.max(car.speed-3,-2)});
bind('leftBtn',()=>{car.angle-=0.2});
bind('rightBtn',()=>{car.angle+=0.2});
bind('gasBtn',()=>{car.speed=Math.min(car.speed+3,10); fuel=Math.max(0,fuel-1)});

document.addEventListener('keydown',e=>{
  if(e.key=='ArrowUp'||e.key=='w') car.speed=Math.min(car.speed+2,9);
  if(e.key=='ArrowDown'||e.key=='s') car.speed=Math.max(car.speed-3,-2);
  if(e.key=='ArrowLeft'||e.key=='a') car.angle-=0.2;
  if(e.key=='ArrowRight'||e.key=='d') car.angle+=0.2;
});

function drawCity(){
  ctx.fillStyle="#2d6a2e"; ctx.fillRect(0,0,700,450);
  ctx.fillStyle="#333"; ctx.fillRect(0,100,700,90); ctx.fillRect(0,280,700,90); ctx.fillRect(200,0,90,450); ctx.fillRect(500,0,90,450);
  ctx.fillStyle="white";
  for(let x=0;x<700;x+=40) ctx.fillRect(x,140,20,4);
  for(let x=0;x<700;x+=40) ctx.fillRect(x,320,20,4);
  // Labels
  ctx.fillStyle="#ffcc00"; ctx.fillRect(20,20,120,60); ctx.fillStyle="black"; ctx.font="bold 14px Arial"; ctx.fillText("KEJETIA",40,55);
  ctx.fillStyle="#00bfff"; ctx.fillRect(380,20,100,60); ctx.fillText("ADUM",410,55);
  ctx.fillStyle="#fff"; ctx.fillRect(20,200,120,60); ctx.fillStyle="black"; ctx.fillText("SANTASI",40,235);
  ctx.fillStyle="#ff6b6b"; ctx.fillRect(380,200,100,60); ctx.fillText("KNUST",410,235);
}
function drawCar(x,y,angle,color,emoji){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  ctx.fillStyle=color; ctx.fillRect(-20,-32,40,65);
  ctx.fillStyle="#111"; ctx.fillRect(-14,-22,28,30);
  ctx.fillStyle="#00bfff"; ctx.fillRect(-14,-18,28,10);
  ctx.fillStyle="black"; ctx.fillRect(-24,-28,8,12); ctx.fillRect(16,-28,8,12); ctx.fillRect(-24,16,8,12); ctx.fillRect(16,16,8,12);
  ctx.restore();
  if(emoji){ ctx.font="20px Arial"; ctx.fillText(emoji,x-10,y-40); }
}
function loop(){
  drawCity();
  coins.forEach(c=>{ ctx.fillStyle="#ffcc00"; ctx.beginPath(); ctx.arc(c.x,c.y,13,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.font="bold 12px Arial"; ctx.fillText("₵",c.x-4,c.y+4); });
  houses.forEach(h=>{ ctx.font="30px Arial"; ctx.fillText(h.done?"✅":"🏠",h.x-15,h.y+10); ctx.font="10px Arial"; ctx.fillStyle="white"; ctx.fillText(h.done?"Delivered!":"Deliver Water",h.x-25,h.y+25); });
  traffic.forEach(t=>{
    t.y+=t.speed; if(t.y>470){t.y=-70; t.x=Math.random()*600+50;}
    drawCar(t.x,t.y,0,"#e50914","🚓");
    if(Math.abs(car.x-t.x)<35 && Math.abs(car.y-t.y)<55 && gameOn){
      score=Math.max(0,score-15); fuel-=8;
      document.getElementById('msg').innerText="🚓 POLICE CAUGHT YOU! -15 points!";
      t.y=-70; setTimeout(()=>document.getElementById('msg').innerText="",2000);
    }
  });
  if(gameOn){
    car.x+=Math.sin(car.angle)*car.speed; car.y-=Math.cos(car.angle)*car.speed; car.speed*=0.98;
    if(car.x<20)car.x=20; if(car.x>680)car.x=680; if(car.y<20)car.y=20; if(car.y>430)car.y=430;
    fuel-=0.03; if(fuel<=0){gameOn=false; alert("⛽ Fuel finished! Score: "+score); }
    coins.forEach((c,i)=>{ if(Math.abs(car.x-c.x)<35 && Math.abs(car.y-c.y)<35){ score+=10; fuel=Math.min(100,fuel+8); coins[i]={x:Math.random()*600+50,y:Math.random()*350+50}; document.getElementById('score').innerText=score; }});
    houses.forEach(h=>{ if(!h.done && Math.abs(car.x-h.x)<40 && Math.abs(car.y-h.y)<40){ h.done=true; score+=30; fuel=Math.min(100,fuel+10); document.getElementById('score').innerText=score; document.getElementById('msg').innerText="💧 Delivered RAVEL Water! +30!"; setTimeout(()=>document.getElementById('msg').innerText="",2000); if(houses.every(x=>x.done)){ level++; document.getElementById('level').innerText="Level "+level; alert("🎉 LEVEL "+level+"! You delivered all water!"); startGame(); } }});
    if(score>best){best=score; localStorage.setItem('ravel_best',best); document.getElementById('best').innerText=best;}
    document.getElementById('fuel').innerText=Math.floor(fuel);
  }
  drawCar(car.x,car.y,car.angle,"#0077cc","💧");
  requestAnimationFrame(loop);
}
loop();

// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').style.display="block"; });
document.getElementById('installBtn').addEventListener('click',async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); } else { alert("On iPhone: Share > Add to Home Screen. On Android: Chrome Menu > Add to Home Screen"); } });
</script>
</body>
</html>
